[package]
name = "wotta_contracts"
version = "0.1.0"
edition = "2024_07"

[cairo]
sierra-replace-ids = true

[dependencies]
starknet = "2.17.0"
openzeppelin = "3.0.0"

[dev-dependencies]
snforge_std = "0.59.0"

[[target.starknet-contract]]
sierra = true
casm = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
exit_first = true
